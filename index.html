<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width = device - width, initial - scale = 1.0">

    <title> Profile Card </title>

    <script src = "https://cdn.tailwindcss.com"></script>

    <link rel = "stylesheet" href = "style.css">
</head>

<body>

    <header>
        <h1> My Profile </h1>
    </header>

    <main>
        <div class = "card">

            <div class = "profile-top">
                <div class = "avatar">TN</div>

                <div>
                    <h2> Temirlan Nussipkozha </h2>
                    <p class = "role"> Computer Science Student </p>
                </div>
            </div>

            <p class = "bio">
                I am a university student interested in technology,
                programming and web development. I enjoy learning
                new skills and creating useful projects.
            </p>

            <div class = "links">
                <a href = "https://www.linkedin.com/in/temirlan-nussipkozha-7408a4438/"
                   class = "text-blue-600 hover:underline">
                    Linkedln
                </a>

                <a href = "https://github.com/mensiyaqty"
                   target = "_blank"
                   class = "text-blue-600 hover:underline">
                    GitHub
                </a>
            </div>

            <button id = "likeButton">
                ♡ Like
            </button>

        </div>
    </main>

    <footer>
        <p> © 2026 My Profile </p>
    </footer>

    <script src = "script.js"></script>

</body>
</html>
